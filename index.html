<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đọc điền THPTQG</title>

<style>

#homeBtn {
  font-size: 26px;
  text-decoration: none;
  margin-right: 10px;
  color: #fff;
  position: absolute;
  left: 10px;
  top: 8px;
  transition: 0.25s;
}

#homeBtn:hover {
  color: #ffd700;
  cursor: pointer;
}



body {font-family: Arial, sans-serif;margin:0;background:#f5f5f5;}
header {background:#213C51;color:#fff;padding:10px;text-align:center;}
#timer {font-size:20px;margin-top:5px;}

.container {width:90%;max-width:900px;margin:20px auto;background:#fff;
  padding:20px;border-radius:8px;box-shadow:0 0 8px rgba(0,0,0,0.1);}

.exercise-title {font-size:22px;margin-bottom:15px;font-weight:bold;color:#333;}

.reading-box{
  border:1px solid #ccc;
  padding:10px;
  height:300px;
  overflow-y:auto;
  border-radius:6px;
  background:#fafafa;
  margin-bottom:10px;
  font-size:20px;
}
.questions-box{
border:1px solid #ccc;padding:10px;height:160px;overflow-y:auto;
  border-radius:6px;background:#ECF4E8;margin-bottom:10px;  font-size:20px;
}

.question{margin-bottom:12px;}
#questions label {display:block;margin:6px 0 6px 10px;line-height:1.4;}
.result-box{border:1px solid #aaa;background:#eef;padding:12px;margin-top:12px;
  border-radius:6px;white-space:pre-line;}

.buttons {
  text-align: left;
  margin-top: 10px;
  display: flex;
  gap: 10px;
}

.buttons .right { margin-left: auto; }

/* Nút + hover */
button {
  font-size: 18px;
  padding: 10px 18px;
  font-weight: 600;
  border-radius: 6px;
  transition: all 0.2s ease;
}
button:hover { background-color:#e0e0e0; cursor:pointer;}

.pagination{text-align:center;margin-top:15px;}
.pagination button{padding:6px 12px;margin:2px;}

.modal{
  position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);
  display:none;justify-content:center;align-items:center;}
.modal-content{
 background:#fff;padding:18px;border-radius:6px;text-align:center;width:280px;
 box-shadow:0 0 8px rgba(0,0,0,.3);}
.modal button{margin:5px;padding:6px 14px;}

.center{text-align:center;}



.highlight {
  background: yellow;
}
/* Menu highlight nhỏ gọn */
#textMenu {
  position: absolute;
  display: none;
  background: #fff;
  border: 1px solid #555;
  padding: 4px 6px;
  border-radius: 4px;
  box-shadow: 0 0 5px rgba(0,0,0,.25);
  z-index: 999;
}

/* Nút nhỏ */
#textMenu button {
  font-size: 12px;
  padding: 2px 6px;
  margin: 2px 0;
  border: none;
  background: #e8e8e8;
  border-radius: 3px;
  cursor: pointer;
}

#textMenu button:hover {
  background: #d6d6d6;
}


#noteBox {
  width: 90%;
  height: 120px;
  margin-top: 12px;
  border: 1px solid #ccc;
  border-radius: 6px;
  padding: 8px;
  font-size: 22px;
  color: #F63049;
font-family: "Arial", sans-serif;
  background: #fffef7;
  resize: vertical;
}
#noteBox:focus {
  outline: none;
  border-color: #4a90e2;
  background: #fff;
}



</style>
</head>

<body>
<header>
<a id="homeBtn" href="https://ketng91.github.io/khoathpt/">🏠</a>

  <h2>Luyện đọc điền THPTQG - Lớp Anh thầy Kết | Đề 01: Tỉnh Phú Thọ </h2>
  <div id="timer">00:00</div>
</header>

<!-- Menu highlight -->
<div id="textMenu" class="menu">
  <button onclick="applyHighlight()">Highlight</button>
  <button onclick="removeHighlight()">Remove</button>
</div>

<div class="container">
  <div class="exercise-title" id="title">Test 1</div>
  <div class="reading-box" id="reading"></div>
  <div class="questions-box" id="questions"></div>

  <div id="resultArea"></div>

  <div class="buttons">
    <button onclick="prevQ()">Back</button>
    <button onclick="nextQ()">Next</button>
    <button class="right" onclick="openConfirm()">Submit</button>
  </div>

  <div class="pagination" id="pagination"></div>

<textarea id="noteBox" placeholder="Ghi chú khi làm bài..."></textarea>

</div>

<!-- modal -->
<div class="modal" id="confirmBox">
  <div class="modal-content">
    <p>Bạn muốn nộp bài?</p>
    <button onclick="submitTest()">Yes</button>
    <button onclick="closeConfirm()">No</button>
  </div>
</div>

<script>
// TIMER
let sec=0;setInterval(()=>{sec++;let m=Math.floor(sec/60),s=sec%60;
document.getElementById('timer').innerText=
(m<10?'0'+m:m)+':'+(s<10?'0'+s:s)},1000);

// DATA có explain
const exercises={
1:{
passage:`<h4 <b>VINFAST: VIETNAMESE AUTOMAKER’S GLOBAL AMBITION</b> </h4>
In the competitive automotive industry, VinFast (1) ______ significant financial resources to develop its electric vehicle technology. The company intended to establish (2) ______ opportunities and become a leading manufacturer in global markets. VinFast has tried to deal (3) ______ a lack of consumer familiarity with its products. (4) ______ the company invested heavily in research and development, it still needed to prove its credibility compared to other (5) ______ in the market. VinFast aimed to take (6) ______ advantage of its technological innovations. However, this required not just partial efforts but a commitment to maximizing every opportunity to compete with established global brands.`,
questions:[
  {
    "q": "Question 1:",
    "options": ["invested", "saved", "borrowed", "wasted"],
    "answer": 0,
    "explain": "Dựa vào ngữ cảnh VinFast bỏ ra nguồn lực tài chính để phát triển công nghệ, 'invested' (đầu tư) là từ phù hợp nhất. Cụm từ: invest resources in something."
  },
  {
    "q": "Question 2:",
    "options": ["much", "every", "many", "little"],
    "answer": 2,
    "explain": "Từ 'opportunities' là danh từ số nhiều đếm được, do đó ta dùng 'many'. 'Much' và 'little' dùng cho danh từ không đếm được, 'every' dùng cho danh từ số ít."
  },
  {
    "q": "Question 3:",
    "options": ["in", "of", "at", "with"],
    "answer": 3,
    "explain": "Cụm động từ cố định: 'deal with something' có nghĩa là giải quyết hoặc đối mặt với vấn đề gì đó (ở đây là sự thiếu hụt sự nhận diện thương hiệu)."
  },
  {
    "q": "Question 4:",
    "options": ["While", "However", "Although", "Because"],
    "answer": 2,
    "explain": "Dùng 'Although' để nối hai mệnh đề tương phản: Mặc dù đầu tư mạnh vào R&D, nhưng vẫn cần chứng minh uy tín. 'However' thường đứng sau dấu chấm và ngăn cách bởi dấu phẩy."
  },
  {
    "q": "Question 5:",
    "options": ["vehicle makers electric", "makers vehicle electric", "electric vehicle makers", "makers electric vehicle"],
    "answer": 2,
    "explain": "Trật tự tính từ/danh từ ghép trong tiếng Anh: 'electric vehicle makers' (các nhà sản xuất xe điện). 'Electric vehicle' đóng vai trò bổ nghĩa cho 'makers'."
  },
  {
    "q": "Question 6:",
    "options": ["complete", "total", "full", "whole"],
    "answer": 2,
    "explain": "Cụm từ cố định (collocation): 'take full advantage of something' có nghĩa là tận dụng tối đa lợi thế của cái gì đó."
  }
]},
2:{
passage:`<h4 <b>EMBRACING DIGITAL TRANSFORMATION IN HIGHER EDUCATION</b> </h4>
The Global Education Summit 2025, scheduled for November at the National Convention Center, will address the urgent need for pedagogical reforms. The summit will highlight digital platforms (7) ______ have revolutionized the way students access academic resources. This transition is expected to benefit (8) ______ universities that are striving to integrate AI-driven tools into their curricula.
Educators will be encouraged to explore a vast (9) ______ of instructional strategies, from flipped classrooms to blended learning models. The keynote speech (10) ______ by Professor Elena Vance will analyze the psychological impacts of remote learning on student engagement.
This event is a golden opportunity for academics, school administrators, and tech developers to exchange ideas and foster (11) ______. We strongly advise interested parties to (12) ______ the workshops in advance to guarantee participation in these high-demand sessions.

For more information, please visit https://edusummit2025.edu`,
questions:[
  {
    "q": "Question 7:",
    "options": ["whom", "whose", "who", "which"],
    "answer": 3,
    "explain": "Sử dụng đại từ quan hệ 'which' để thay thế cho danh từ chỉ vật phía trước là 'digital platforms' (các nền tảng kỹ thuật số)."
  },
  {
    "q": "Question 8:",
    "options": ["initial", "superior", "primary", "leading"],
    "answer": 3,
    "explain": "Cụm từ 'leading universities' có nghĩa là 'các trường đại học hàng đầu'. Đây là cách kết hợp từ phổ biến để chỉ các tổ chức dẫn đầu trong lĩnh vực giáo dục."
  },
  {
    "q": "Question 9:",
    "options": ["deal", "number", "amount", "level"],
    "answer": 1,
    "explain": "Cụm từ 'a vast number of + danh từ số nhiều' (ở đây là instructional strategies) dùng để chỉ một số lượng lớn các chiến lược giảng dạy."
  },
  {
    "q": "Question 10:",
    "options": ["delivering", "delivers", "is delivered", "delivered"],
    "answer": 3,
    "explain": "Đây là dạng rút gọn mệnh đề quan hệ mang nghĩa bị động: 'The keynote speech (which is) delivered by...'. Bài diễn văn chính được trình bày bởi Giáo sư Elena."
  },
  {
    "q": "Question 11:",
    "options": ["innovatively", "innovation", "innovate", "innovative"],
    "answer": 1,
    "explain": "Sau động từ 'foster' (thúc đẩy/nuôi dưỡng) cần một danh từ. 'Innovation' (sự đổi mới/cải tiến) là danh từ phù hợp nhất về cả ngữ pháp và ngữ nghĩa."
  },
  {
    "q": "Question 12:",
    "options": ["register for", "account for", "apply for", "look for"],
    "answer": 0,
    "explain": "Cụm từ 'register for the workshops' có nghĩa là 'đăng ký tham gia các buổi hội thảo'. 'Account for' (giải thích), 'Apply for' (nộp đơn xin việc/học bổng), 'Look for' (tìm kiếm)."
  }
]},




};
// STATE
let currentTest=1,currentQuestionIndex=0;
let savedAnswers={}; // lưu kiểu { "1-0":2 , "1-1":1 , "2-3":0 }

function loadTest(num){
 currentTest=num;
document.getElementById('title').innerText=
'Read the following text and mark the letter A, B, C or D to indicate the option that best fits each of the numbered blanks';

 document.getElementById('resultArea').innerHTML='';
 currentQuestionIndex=0;
 document.getElementById('reading').innerHTML = exercises[num].passage.replace(/\n/g,'<br>');
 renderQuestions(); renderPagination();
}

function renderQuestions(){
 const q=exercises[currentTest].questions[currentQuestionIndex];
 let key=currentTest+'-'+currentQuestionIndex;
 let html='<div class="question">'+(currentQuestionIndex+1)+'. '+ q.q +'</div>';

 q.options.forEach((opt,i)=>{
   const checked = savedAnswers[key]==i ? 'checked' : '';
   html+=`<label><input type="radio" name="q${currentQuestionIndex}"
    value="${i}" ${checked} onclick="saveAnswer(${i})"> ${opt}</label>`;
 });

 document.getElementById('questions').innerHTML=html;
}

function saveAnswer(v){
 savedAnswers[currentTest+'-'+currentQuestionIndex]=v;
}

function nextQ(){
 if(currentQuestionIndex < exercises[currentTest].questions.length-1){
   currentQuestionIndex++;
   renderQuestions();
 }
}
function prevQ(){
 if(currentQuestionIndex>0){
   currentQuestionIndex--;
   renderQuestions();
 }
}

function renderPagination(){
 let h='';
 for(let k in exercises)
   h+=`<button onclick="loadTest(${k})">Passage ${k}</button>`;
 document.getElementById('pagination').innerHTML=h;
}

// Confirm box
function openConfirm(){document.getElementById('confirmBox').style.display='flex';}
function closeConfirm(){document.getElementById('confirmBox').style.display='none';}

// SUBMIT
function submitTest(){
 closeConfirm();
 const qs=exercises[currentTest].questions;
 let correct=0,txt='';

 for(let i=0;i<qs.length;i++){
   let key=currentTest+'-'+i;
   let chosen=savedAnswers[key];
   let ok=chosen==qs[i].answer;
   if(ok) correct++;
   txt+=`${i+1}. ${qs[i].q}
Your answer: ${chosen!=null?qs[i].options[chosen]:'(no answer)'}
Correct answer: ${qs[i].options[qs[i].answer]}
${ok?'✓ Correct':'✗ Wrong'}
Giải thích: ${qs[i].explain}\n\n`;
 }

 document.getElementById('resultArea').innerHTML=
 `<div class="result-box">Kết quả: ${correct}/${qs.length}\n\n${txt}</div>`;
}

let selectedRange = null;

// Hiện menu khi chọn chữ hoặc click highlight
document.addEventListener('mouseup', function(e) {
  const sel = window.getSelection();

  // Nếu click vào chữ đã highlight
  if (e.target.classList.contains('highlight')) {
    selectedRange = null;
    showMenu(e.pageX, e.pageY);
    selectedRange = e.target;
    return;
  }

  // Nếu không select gì thì đóng menu
  if (!sel.toString().trim()) {
    hideMenu();
    return;
  }

  selectedRange = sel.getRangeAt(0);
  showMenu(e.pageX, e.pageY);
});

// Highlight
function applyHighlight() {
  if (!selectedRange) return;

  // Nếu click highlight đang tồn tại → bỏ highlight trước rồi tô lại
  if (selectedRange instanceof HTMLElement && selectedRange.classList.contains('highlight')) {
    removeHighlight();
    return;
  }

  const span = document.createElement('span');
  span.className = 'highlight';
  span.appendChild(selectedRange.extractContents());
  selectedRange.insertNode(span);

  selectedRange = null;
  hideMenu();
}

// Remove highlight
function removeHighlight() {
  if (!selectedRange) return;

  if (selectedRange instanceof HTMLElement && selectedRange.classList.contains('highlight')) {
    const parent = selectedRange.parentNode;
    while (selectedRange.firstChild) {
      parent.insertBefore(selectedRange.firstChild, selectedRange);
    }
    parent.removeChild(selectedRange);
  }
  selectedRange = null;
  hideMenu();
}

// menu show/hide
function showMenu(x, y) {
  const box = document.getElementById('textMenu');
  box.style.left = x + 'px';
  box.style.top = y + 'px';
  box.style.display = 'block';
}
function hideMenu() {
  document.getElementById('textMenu').style.display = 'none';
}



window.onload=()=>loadTest(1);
</script>



</body>
</html>
